spring:
  application:
    name: version1
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        multiTenancy: DISCRIMINATOR
        format_sql: true
        tenant_identifier_resolver: com.proyecto.version1.config.TenantIdentifierResolver

# these properties need to be well organized across the different ENV
app:
  security:
    jwt:
      access-token-expiration: 86400000 #24 hours for local testing #900000 # 15 minutes
      refresh-token-expiration: 604800000 # 7 days
    disposable-email: 10minutemail,20minutemail,33mail,5ymail,anonbox,guerrillamail,mailinator,maildrop,mailnesia,moakt,my10minutemail,throwawaymail,trashmail,temp-mail,tempmail,truemail,yopmail

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:mock-access-key-id}
  secret-key: ${AWS_SECRET_ACCESS_KEY:mock-secret-access-key}
  s3:
    bucket: ${AWS_S3_BUCKET_NAME:mock-bucket-name}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:mock-topic-arn}
